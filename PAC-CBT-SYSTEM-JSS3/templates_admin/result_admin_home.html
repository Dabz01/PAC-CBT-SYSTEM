{% extends "base.html" %}
{% block content %}

<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div>
    <h4 class="mb-0">Result Module</h4>
    <div class="text-muted small">Welcome {{ result_admin_name }}.</div>
  </div>
  <div class="d-flex gap-2 flex-wrap">
    <a class="btn btn-sm btn-outline-primary" href="{{ url_for('create_result_admin') }}"><i class="bi bi-person-plus me-1"></i>Create Result Admin</a>
    <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('result_admin_logout') }}"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body">
    <div class="text-muted small mb-2">Select a class:</div>
    <div class="d-flex flex-wrap gap-2">
      {% for c in classes %}
        <a class="btn btn-primary" href="{{ url_for('result_class', klass=c) }}">
          <i class="bi bi-people me-1"></i>{{ c }}
        </a>
      {% endfor %}
    </div>
  </div>
</div>

{% endblock %}
