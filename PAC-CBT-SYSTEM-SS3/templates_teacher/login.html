{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-5">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="logo-card" style="width:86px;height:86px;">
            <img src="{{ url_for('static', filename='pac_logo.png') }}" alt="{{ SCHOOL_NAME }} logo">
          </div>
          <div>
            <h3 class="mb-1">Teacher Login</h3>
            <div class="text-muted">Create exams • Add questions • Manage access codes</div>
          </div>
        </div>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <button class="btn btn-primary btn-animated w-100 py-3 fw-semibold" type="submit">Login</button>
        </form>
        <div class="footer-note">Teacher Portal • {{ SCHOOL_NAME }}</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
